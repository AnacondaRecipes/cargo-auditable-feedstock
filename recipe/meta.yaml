{% set name = "cargo-auditable" %}
{% set version = "0.7.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/rust-secure-code/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8e6566cf51444f6f6d10230e62487979fa79247fe027d0a8acafaa88e6af0fd7

build:
  number: 0
  script_env:
    - CARGO_PROFILE_RELEASE_STRIP=symbols
    - CARGO_PROFILE_RELEASE_LTO=fat

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses

tests:
  script:
    - cargo auditable --help

about:
  home: https://github.com/rust-secure-code/cargo-auditable
  license: Apache-2.0 OR MIT
  license_family: OTHER
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Make production Rust binaries auditable
  description: Make production Rust binaries auditable
  dev_url: https://github.com/rust-secure-code/cargo-auditable
  doc_url: https://github.com/rust-secure-code/cargo-auditable

extra:
  recipe-maintainers:
    - xhochy
